model:
  name: "customer_classifier"
  type: "classification"

features:
  - name: "age"
    type: "numeric"
    required: true

  - name: "income"
    type: "numeric"
    required: true

  - name: "account_type"
    type: "categorical"
    values: ["basic", "premium", "enterprise"]
    required: true

target:
  name: "will_convert"
  type: "binary"

training:
  algorithm: "RandomForestClassifier"
  hyperparameters:
    n_estimators: 100
    max_depth: 10
    random_state: 42

  preprocessing:
    numerical_features:
      strategy: "standardize"
    categorical_features:
      strategy: "one_hot_encode"

validation:
  test_size: 0.2
  cross_validation_folds: 5

monitoring:
  drift_threshold: 0.15
  performance_metrics:
    - "accuracy"
    - "f1_score"
    - "roc_auc"
